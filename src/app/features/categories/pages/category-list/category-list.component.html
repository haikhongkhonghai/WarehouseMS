<app-page-header title="Quản lý Danh mục" subtitle="Danh sách các danh mục sản phẩm">
  <a routerLink="/categories/new" class="btn btn--primary">
    <svg
      width="16"
      height="16"
      viewBox="0 0 24 24"
      fill="none"
      stroke="currentColor"
      stroke-width="2"
    >
      <line x1="12" y1="5" x2="12" y2="19" />
      <line x1="5" y1="12" x2="19" y2="12" />
    </svg>
    Thêm danh mục
  </a>
</app-page-header>

<div class="filters-bar">
  <input
    class="filter-input"
    placeholder="Tìm theo tên danh mục hoặc mô tả..."
    [ngModel]="searchKeyword()"
    (ngModelChange)="searchKeyword.set($event)"
  />
</div>

@if (filteredCategories().length > 0) {
  <div class="card">
    <div class="table-container">
      <table class="data-table">
        <thead>
          <tr>
            <th>Mã danh mục</th>
            <th class="th--sortable" (click)="toggleSort('tenDanhMuc')">
              <span class="th-content">
                Tên danh mục
                <svg
                  class="sort-icon"
                  [class.sort-icon--asc]="sortField() === 'tenDanhMuc' && sortDirection() === 'asc'"
                  [class.sort-icon--desc]="sortField() === 'tenDanhMuc' && sortDirection() === 'desc'"
                  width="14"
                  height="14"
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2.5"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                >
                  <path d="m7 9 5-5 5 5" class="sort-arrow-up" />
                  <path d="m7 15 5 5 5-5" class="sort-arrow-down" />
                </svg>
              </span>
            </th>
            <th>Mô tả</th>
            <th class="th--sortable" (click)="toggleSort('productCount')">
              <span class="th-content">
                Số sản phẩm
                <svg
                  class="sort-icon"
                  [class.sort-icon--asc]="sortField() === 'productCount' && sortDirection() === 'asc'"
                  [class.sort-icon--desc]="sortField() === 'productCount' && sortDirection() === 'desc'"
                  width="14"
                  height="14"
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2.5"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                >
                  <path d="m7 9 5-5 5 5" class="sort-arrow-up" />
                  <path d="m7 15 5 5 5-5" class="sort-arrow-down" />
                </svg>
              </span>
            </th>
            <th>Thao tác</th>
          </tr>
        </thead>
        <tbody>
          @for (category of filteredCategories(); track category.id) {
            <tr>
              <td>
                <span class="code-badge">{{ category.maDanhMuc }}</span>
              </td>
              <td class="td--bold">{{ category.tenDanhMuc }}</td>
              <td class="td--muted">{{ category.moTa || '—' }}</td>
              <td>{{ getProductCount(category.id) }}</td>
              <td>
                <div class="action-btns">
                  <a
                    [routerLink]="['/categories', category.id, 'edit']"
                    class="btn-icon btn-icon--edit"
                    title="Sửa"
                  >
                    ✏️
                  </a>
                  <button
                    class="btn-icon btn-icon--delete"
                    (click)="confirmDelete(category)"
                    title="Xóa"
                  >
                    🗑️
                  </button>
                </div>
              </td>
            </tr>
          }
        </tbody>
      </table>
    </div>
  </div>
} @else {
  <div class="card">
    <app-empty-state message="Không tìm thấy danh mục nào." />
  </div>
}

<app-confirm-dialog
  [visible]="showDeleteDialog()"
  title="Xóa danh mục"
  [message]="
    'Bạn có chắc chắn muốn xóa danh mục \'' + (selectedCategory()?.tenDanhMuc ?? '') + '\'?'
  "
  (confirmed)="onDeleteConfirmed()"
  (cancelled)="showDeleteDialog.set(false)"
/>
